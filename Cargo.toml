[workspace]
resolver = "2"
members = [
    "src/tui-core",
    "src/tui-compositor",
    "src/tui-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TUI-OS Team"]
license = "MIT OR Apache-2.0"
rust-version = "1.81"

[workspace.dependencies]
crossterm = "0.28"
termion = "4.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
thiserror = "2"
once_cell = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
